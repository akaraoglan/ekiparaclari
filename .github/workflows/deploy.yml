name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: VPS'e Bağlan ve Güncellemeyi Yayınla
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /root/ekiparaclari
            git pull origin main
            /root/ekiparaclari/venv/bin/pip install -r requirements.txt
            systemctl restart ekiparaclari.service
            systemctl status ekiparaclari.service --no-pager
