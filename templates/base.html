<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ekip Araçları{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="theme-dark">
    <header class="topbar">
        <a href="{{ url_for('index') }}" class="brand">Ekip Araçları</a>
        <div class="topbar-actions">
            <a href="https://docs.google.com/document/d/16MLlIuHA1GkUJZV8I31c0klPo-oLboDB/edit?usp=sharing&ouid=102888922354271613534&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer" class="theme-btn">Notlar</a>
            <button id="themeToggle" class="theme-btn" type="button">Tema Değiştir</button>
        </div>
    </header>
    <main class="page-wrap">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="alerts">
              {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
