<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arif Karaoğlan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #333;
}

.container {
  width: 100%;
  max-width: 900px;
}

.hero {
  text-align: center;
  margin-bottom: 48px;
  color: #fff;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.25);
  margin-bottom: 20px;
}

.hero-badge i {
  font-size: 32px;
  color: #fff;
}

.hero h1 {
  font-size: 36px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
}

.hero p {
  font-size: 17px;
  opacity: 0.9;
  font-weight: 400;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 24px;
  margin-bottom: 40px;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 32px;
  text-decoration: none;
  color: inherit;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  display: block;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #667eea, #764ba2);
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
}

.card-icon {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #667eea, #764ba2);
  margin-bottom: 20px;
}

.card-icon i {
  font-size: 26px;
  color: #fff;
}

.card h2 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
  color: #2d3748;
}

.card p {
  font-size: 14px;
  color: #718096;
  line-height: 1.6;
  margin-bottom: 18px;
}

.card-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  font-weight: 600;
  color: #667eea;
}

.card-link i {
  font-size: 12px;
  transition: transform 0.2s ease;
}

.card:hover .card-link i {
  transform: translateX(4px);
}

footer {
  text-align: center;
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  padding-top: 16px;
}

@media (max-width: 600px) {
  .hero h1 { font-size: 28px; }
  .hero p { font-size: 15px; }
  .card { padding: 24px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="hero">
    <div class="hero-badge"><i class="fas fa-th-large"></i></div>
    <h1>Arif Karaoğlan</h1>
    <p>Araçlar ve rehbere buradan ulaşabilirsiniz</p>
  </div>

  <div class="cards">

    <a href="/ekip-araclari" class="card">
      <div class="card-icon"><i class="fas fa-tools"></i></div>
      <h2>Ekip Araçları</h2>
      <p>PDF, Excel, XML ve KDV işleme araçları. Dosyalarınızı hızlıca işleyin.</p>
      <span class="card-link">Aç <i class="fas fa-arrow-right"></i></span>
    </a>

    <a href="/rehber" class="card">
      <div class="card-icon"><i class="fas fa-address-book"></i></div>
      <h2>İnegöl Yanımda Rehber</h2>
      <p>Firma ve iletişim rehberi. Aradığınız bilgiye kolayca ulaşın.</p>
      <span class="card-link">Aç <i class="fas fa-arrow-right"></i></span>
    </a>

  </div>

  <footer>© 2026 · Arif Karaoğlan</footer>

</div>
</body>
</html>
